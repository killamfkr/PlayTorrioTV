# Builds a release APK for Android TV (Leanback is declared in AndroidManifest.xml).
# - Uploads workflow artifact playtorrio-android-tv-release
# - On push / manual runs (not PRs): creates a draft GitHub Release with the APK attached

name: Build Android TV APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/*.gradle.kts
            android/**/gradle-wrapper.properties

      # sdkmanager expects space-separated package ids — a multiline YAML block is
      # treated as one invalid package name on some runners.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release
        env:
          GRADLE_OPTS: -Xmx4g

      # Output path varies (flutter-apk vs apk/release). Collect every release APK.
      - name: Collect APKs for artifact
        run: |
          set -e
          mkdir -p artifact_apk
          find build/app/outputs -type f -name '*.apk' -print
          find build/app/outputs -type f -name '*.apk' -exec cp -f {} artifact_apk/ \;
          ls -la artifact_apk/
          count=$(find artifact_apk -maxdepth 1 -name '*.apk' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No APK files found under build/app/outputs"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: playtorrio-android-tv-release
          path: artifact_apk/*.apk
          if-no-files-found: error

      - name: Create draft GitHub Release with APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          tag_name: android-tv-build-${{ github.run_number }}
          name: PlayTorrio TV Android (draft ${{ github.run_number }})
          body: |
            Automated draft build from `${{ github.sha }}` on `${{ github.ref_name }}`.

            Download the **.apk** asset below, install on your Android TV (e.g. `adb install`), then **edit this release** and click **Publish** when you are ready.
          files: artifact_apk/*.apk
