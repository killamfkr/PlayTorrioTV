# Builds a release APK for Android TV without marketplace Actions (no `uses:` for
# actions/checkout, etc.) — for orgs that only allow actions from repos they own.
#
# Checkout: raw git + GITHUB_TOKEN. SDK/Flutter: curl + unzip + git clone.
# On push/workflow_dispatch to main: `gh release create` draft with APK assets.

name: Build Android TV APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD

      - name: Install JDK 17
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk-headless
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Install Android command-line tools
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          # Pin a known cmdline-tools build (adjust if Google removes this zip)
          curl -fsSL -o /tmp/cmdline.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SM" || true
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          # GITHUB_PATH is not active in this step — call sdkmanager by full path
          # Without `set +o pipefail`, `yes | sdkmanager` fails: sdkmanager closes stdin,
          # yes hits SIGPIPE → pipeline non-zero under pipefail even when install OK.
          set +o pipefail
          yes | "$SM" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | "$SM" --sdk_root="$SDK" --licenses
          set -o pipefail

      # GITHUB_PATH only affects *later* steps — do not call flutter in this step.
      - name: Install Flutter (stable)
        run: |
          set -euo pipefail
          git clone --depth=1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter doctor
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms" || { echo "::error::Android SDK platforms missing"; exit 1; }
          flutter doctor -v
          flutter --version

      # Gradle reads sdk.dir from here; Flutter also resolves the SDK more reliably.
      - name: Write android/local.properties
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          FLUTTER_SDK="$HOME/flutter"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$SDK" "$FLUTTER_SDK" > android/local.properties
          cat android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release
        env:
          GRADLE_OPTS: -Xmx4g

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p artifact_apk
          find build/app/outputs -type f -name '*.apk' -print
          find build/app/outputs -type f -name '*.apk' -exec cp -f {} artifact_apk/ \;
          ls -la artifact_apk/
          n=$(find artifact_apk -maxdepth 1 -name '*.apk' | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "::error::No APK files found under build/app/outputs"
            exit 1
          fi

      - name: Create draft GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-tv-build-${{ github.run_number }}"
          cd artifact_apk
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --draft \
            --title "PlayTorrio TV Android (draft ${{ github.run_number }})" \
            --notes "Automated draft from \`${{ github.sha }}\` on \`${{ github.ref_name }}\`.

          Download an **.apk** below, install on Android TV (\`adb install\`), then **Publish** the release when ready." \
            ./*.apk
