# Builds a release APK for Android TV (Leanback is declared in AndroidManifest.xml).
# Artifact: app-release.apk (install via adb or file manager on the TV).

name: Build Android TV APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/*.gradle.kts
            android/**/gradle-wrapper.properties

      # sdkmanager expects space-separated package ids — a multiline YAML block is
      # treated as one invalid package name on some runners.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release
        env:
          GRADLE_OPTS: -Xmx4g

      # Output path varies (flutter-apk vs apk/release). Collect every release APK.
      - name: Collect APKs for artifact
        run: |
          set -e
          mkdir -p artifact_apk
          find build/app/outputs -type f -name '*.apk' -print
          find build/app/outputs -type f -name '*.apk' -exec cp -f {} artifact_apk/ \;
          ls -la artifact_apk/
          count=$(find artifact_apk -maxdepth 1 -name '*.apk' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No APK files found under build/app/outputs"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: playtorrio-android-tv-release
          path: artifact_apk/*.apk
          if-no-files-found: error
