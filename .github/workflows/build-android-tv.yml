# Builds a release APK for Android TV without marketplace Actions (no `uses:` for
# actions/checkout, etc.) — for orgs that only allow actions from repos they own.
#
# Checkout: raw git + GITHUB_TOKEN. SDK/Flutter: curl + unzip + git clone.
# Draft release with APK: push to main, workflow_dispatch, or pull_request from the
# same repo (fork PRs skip release — token cannot upload to base repo).

name: Build Android TV APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD

      - name: Install JDK 17
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk-headless
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Install Android command-line tools
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          # Pin a known cmdline-tools build (adjust if Google removes this zip)
          curl -fsSL -o /tmp/cmdline.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SM" || true
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          # GITHUB_PATH is not active in this step — call sdkmanager by full path
          # `yes | sdkmanager`: with pipefail, SIGPIPE on yes fails the step even if sdkmanager OK.
          # Without pipefail, $? can be yes's exit — use PIPESTATUS[1] for sdkmanager.
          set +o pipefail
          yes | "$SM" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sm_pkg="${PIPESTATUS[1]}"
          yes | "$SM" --sdk_root="$SDK" --licenses
          sm_lic="${PIPESTATUS[1]}"
          set -o pipefail
          if [ "$sm_pkg" -ne 0 ]; then echo "::error::sdkmanager packages failed with $sm_pkg"; exit "$sm_pkg"; fi
          if [ "$sm_lic" -ne 0 ]; then echo "::error::sdkmanager licenses failed with $sm_lic"; exit "$sm_lic"; fi

      # GITHUB_PATH only affects *later* steps — do not call flutter in this step.
      - name: Install Flutter (stable)
        run: |
          set -euo pipefail
          git clone --depth=1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter doctor
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms" || { echo "::error::Android SDK platforms missing"; exit 1; }
          flutter doctor -v
          flutter --version

      # Gradle reads sdk.dir from here; Flutter also resolves the SDK more reliably.
      - name: Write android/local.properties
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          FLUTTER_SDK="$HOME/flutter"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$SDK" "$FLUTTER_SDK" > android/local.properties
          cat android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi
        env:
          GRADLE_OPTS: -Xmx4g

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p artifact_apk
          find build/app/outputs -type f -name '*.apk' -print
          find build/app/outputs -type f -name '*.apk' -exec cp -f {} artifact_apk/ \;
          ls -la artifact_apk/
          n=$(find artifact_apk -maxdepth 1 -name '*.apk' | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "::error::No APK files found under build/app/outputs"
            exit 1
          fi

      - name: Create draft GitHub Release with APK
        # Was only push/workflow_dispatch — PR runs skipped this step (crossed out in UI).
        if: >
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # run_id is unique; avoids tag collisions when several builds run close together
          TAG="android-tv-${{ github.run_id }}"
          TITLE_REF="${{ github.ref_name }}"
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "pull_request" ]; then
            TITLE_REF="PR #${{ github.event.pull_request.number }} (${{ github.head_ref }})"
          fi
          cd artifact_apk
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --draft \
            --title "PlayTorrio TV Android — $TITLE_REF (draft, run ${{ github.run_id }})" \
            --notes "Automated draft (**$EVENT**) from \`${{ github.sha }}\`.

          **APKs:** \`app-armeabi-v7a-release.apk\` (older 32-bit Fire TV sticks), \`app-arm64-v8a-release.apk\` (most current devices), \`app-x86_64-release.apk\` (emulators). Install with \`adb install\`.

          Tag: \`$TAG\`" \
            ./*.apk
